<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>RPM Memory</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0d0f; color: #f4f2ee; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  .gate { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { width: min(420px, 100%); text-align: center; }
  .msg { font-size: 22px; letter-spacing: 0.04em; line-height: 1.6; }
  .hit { color: #f4f2ee; cursor: pointer; background: none; border: 0; font: inherit; padding: 0; }
  .save { margin-top: calc(22px * 1.6 * 2); width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #2a2a2e; color: #f4f2ee; font-size: 16px; font-weight: 700; }
  .alt { margin-top: 18px; }
  .alt a { color: #f4f2ee; text-decoration: none; font-size: 16px; letter-spacing: 0.04em; }
  .form { display: none; margin-top: 22px; }
  .form.show { display: block; }
  input { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid #3a3a40; background: #17171a; color: #f4f2ee; font-size: 18px; padding: 0 14px; text-align: center; }
  button.go { width: 100%; min-height: 48px; margin-top: 10px; border: 0; border-radius: 12px; background: #2f6fed; color: #fff; font-size: 16px; font-weight: 700; }
  .err { min-height: 20px; margin-top: 10px; color: #ff8a6a; font-size: 13px; }
</style>
</head>

      <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
      <button class="go" type="submit">入る</button>
      <div class="err" id="err"></div>
    </form>
  </div>
</div>

const openPw = document.getElementById("openPw");
const form = document.getElementById("form");
const pw = document.getElementById("pw");
const err = document.getElementById("err");
const exportBtn = document.getElementById("exportBtn");
openPw.addEventListener("click", function() {
  form.classList.add("show");
  setTimeout(function() { pw.focus(); }, 30);
});
function b64(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function unlock(password) {
  const salt = b64(GATE.s);
  const iv = b64(GATE.i);
  const ct = b64(GATE.c);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: GATE.n, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
  return new TextDecoder().decode(plain);
}
form.addEventListener("submit", async function(ev) {
  ev.preventDefault();
  err.textContent = "";
  try {
    const html = await unlock(pw.value);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    err.textContent = "違います";
    pw.select();
  }
});
exportBtn.addEventListener("click", function() {
  const KEYS = ["rpmHistory","rpmFavorites","rpmTarget","rpmLockSnaps","rpmCmpVoltFine","rpmCmpSplit","rpmStableGate","rpmMachine","rpmSetupFavs","rpmMachineApplied","darkMode","rpmOnboardV1","rpmUiTheme","rpmUiThemeV2","rpmLang"];
  const data = {};
  KEYS.forEach(function(k) {
    const v = localStorage.getItem(k);
    if (v != null) data[k] = v;
  });
  if (!Object.keys(data).length) { err.textContent = "この端末にデータがありません"; return; }
  const pack = { app: "rpm-memory", version: 1, exportedAt: new Date().toISOString(), data: data };
  const blob = new Blob([JSON.stringify(pack, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "rpm-memory-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
});
</script>
</body>
</html>
