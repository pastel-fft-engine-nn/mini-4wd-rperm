
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>RPM Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<style>
:root {
  --bg: #f5f7fc;
  --card-bg: #ffffff;
  --accent-blue: #1f7aff;
  --accent-red: #ff4b4b;
  --text-main: #1b1e27;
  --text-sub: #7b8190;
  --border-soft: #e1e4ee;
  --radius-lg: 18px;
  --radius-md: 14px;
  --shadow-soft: 0 10px 26px rgba(0, 0, 0, 0.06);
}
* {
  box-sizing: border-box;
  font-family: "Meiryo", "メイリオ", sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
body {
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at top, #ffffff 0, #eef2fb 45%, #e3e7f7 100%);
  color: var(--text-main);
  overflow-x: hidden;
}
.app-shell {
  max-width: 480px;
  margin: 0 auto;
  padding: 8px 12px 12px;
}
header {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: 10px 12px 10px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  margin-bottom: 8px;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  cursor: pointer;
}
.card-title {
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.wave-container {
  background: radial-gradient(circle at top, #ffffff 0, #e3e9ff 60%, #d6defa 100%);
  border-radius: var(--radius-md);
  padding: 6px 8px 6px;
  border: 1px solid #dde3f5;
  position: relative;
  overflow: hidden;
  margin-bottom: 6px;
}
.wave-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  font-size: 0.8rem;
  color: var(--text-sub);
}
canvas#spectrum {
  width: 100%;
  height: 110px;
  border-radius: 12px;
  background: transparent;
}
.realtime-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  font-size: 0.8rem;
  margin-bottom: 4px;
}
.stat-block {
  background: #f6f7fc;
  border-radius: 12px;
  padding: 4px 6px;
  border: 1px solid #e3e6f4;
}
.stat-label {
  color: var(--text-sub);
  margin-bottom: 2px;
  font-size: 0.75rem;
}
.stat-value {
  font-weight: 700;
  font-size: 1.1rem;
  text-align: right;
  color: #ff4fa3;
}
.realtime-center {
  text-align: center;
  margin: 4px 0 6px;
  font-size: 0.8rem;
  color: var(--accent-blue);
  letter-spacing: 0.12em;
}
.header-right-audio {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-sub);
}
.audio-bars {
  display: flex;
  gap: 2px;
  align-items: flex-end;
  height: 16px;
}
.audio-bar {
  width: 3px;
  height: 4px;
  background: var(--accent-blue);
  border-radius: 2px;
  transition: height 0.1s ease;
}
.rpm-limit-section {
  background: linear-gradient(135deg, #e6ecff 0%, #f0f4ff 100%);
  border-radius: var(--radius-md);
  padding: 6px 10px;
  margin-top: 6px;
  margin-bottom: 6px;
  border: 1px solid #d5dbf0;
}
.rpm-limit-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
}
.rpm-limit-label {
  font-size: 0.75rem;
  color: var(--text-sub);
  font-weight: 600;
  display: flex;
  justify-content: space-between;
}
.rpm-limit-value {
  font-weight: 700;
  color: var(--accent-blue);
}
.realtime-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.primary-btn, .secondary-btn {
  border-radius: 999px;
  padding: 8px 0;
  font-size: 0.8rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
  transition: all 0.2s ease;
  text-align: center;
}
.primary-btn.blue { background: linear-gradient(135deg, #2a8bff, #1f7aff); color: #ffffff; }
.primary-btn.red { background: linear-gradient(135deg, #ff6b6b, #ff4b4b); color: #ffffff; }
.secondary-btn.gray { background: #eef1f8; color: #4b5160; }
.secondary-btn.outline { background: #ffffff; color: var(--accent-blue); border: 1px solid #c9d5ff; }
.primary-btn:active, .secondary-btn:active { transform: scale(0.95); }

.settings-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 2px 0 4px;
}
.setting-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.85rem;
  padding: 0;
}
.setting-label {
  color: var(--text-sub);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 0.8rem;
}
.setting-value {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--accent-blue);
}
input[type="range"] {
  width: 100%;
  -webkit-appearance: none;
  height: 6px;
  border-radius: 999px;
  background: #e3e7f5;
  outline: none;
  margin: 4px 0 2px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid var(--accent-blue);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
  cursor: pointer;
}
.table-wrapper {
  margin-top: 6px;
  border-radius: var(--radius-md);
  border: 1px solid #dde2f2;
  overflow-x: auto;
  max-height: 300px;
  background: #f9fbff;
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 700px;
  font-size: 0.75rem;
}
thead th {
  background: #e6ecff;
  position: sticky;
  top: 0;
  z-index: 3;
  padding: 8px 4px;
  font-weight: 700;
}
th:first-child, td:first-child {
  position: sticky;
  left: 0;
  background: #f3f6ff;
  z-index: 2;
  text-align: left;
}
td {
  padding: 8px 4px;
  border-bottom: 1px solid #dde2f2;
  text-align: right;
}
.highlight-row { background: rgba(31, 122, 255, 0.1) !important; }
.highlight-col { background: rgba(255, 79, 163, 0.05) !important; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal {
  width: 100%;
  max-width: 480px;
  background: #f5f7fc;
  border-radius: 24px 24px 0 0;
  padding: 16px 12px 24px;
  animation: slideUp 0.3s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.modal-title {
  font-size: 1rem;
  font-weight: 700;
}
.modal-close {
  border: none;
  background: transparent;
  font-size: 1.8rem;
  cursor: pointer;
  color: var(--text-sub);
}
.modal .settings-row {
  gap: 8px;
  padding: 0 0 4px;
}
.modal .setting-item {
  gap: 2px;
  padding: 0;
}
.modal input[type="range"] {
  margin: 2px 0 0;
}
.filter-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
  background: #fff;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #e1e4ee;
}
.filter-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-item label {
  font-size: 0.7rem;
  color: var(--text-sub);
  font-weight: 600;
}
.filter-item select {
  padding: 6px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 0.8rem;
  outline: none;
}
.search-btn-row {
  grid-column: span 2;
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 4px;
}
.history-table-wrapper {
  margin-top: 6px;
  border-radius: var(--radius-md);
  border: 1px solid #c7d6ff;
  overflow-x: auto;
  max-height: 350px;
  background: #ffffff;
}
.history-table {
  border-collapse: collapse;
  width: 100%;
  min-width: 650px;
  font-size: 0.7rem;
}
.history-table th, .history-table td {
  padding: 6px 2px;
  border-bottom: 1px solid #eef2ff;
  text-align: center;
  white-space: nowrap;
}
.history-table th:nth-child(3), .history-table td:nth-child(3) { width: 50px; } /* Motor */
.history-table th:nth-child(6), .history-table td:nth-child(6) { width: 40px; } /* Voltage */
.history-table th:nth-child(8), .history-table td:nth-child(8) { width: 40px; } /* Tire */
.delete-btn {
  border: none;
  background: #ffeef2;
  color: #ff4b4b;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.7rem;
}
.input-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}
.input-row label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-sub);
}
.input-row input, .input-row select {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid var(--border-soft);
  font-size: 1rem;
  outline: none;
}
.collapsible-content {
  display: none;
  overflow: visible;
  padding-bottom: 6px;
}
.collapsible-content.active {
  display: block;
}
.toggle-icon::after {
  content: ' ▼';
  font-size: 0.7rem;
  color: var(--text-sub);
}
.active .toggle-icon::after {
  content: ' ▲';
}
  /* ダークモード時のスタイル */
body.dark-mode {
  --bg: #12151c;
  --card-bg: #1a1e29;
  --text-main: #f0f2f5;
  --text-sub: #9ca3af;
  --border-soft: #2a3142;
  --shadow-soft: 0 10px 26px rgba(0, 0, 0, 0.4);
}
body.dark-mode .card {
  border: 1px solid rgba(255, 255, 255, 0.05);
}
body.dark-mode .wave-container {
  background: radial-gradient(circle at top, #222838 0, #161a25 60%, #0e1117 100%);
  border-color: #2a3142;
}
body.dark-mode .stat-block,
body.dark-mode .filter-grid,
body.dark-mode .rpm-limit-section {
  background: #222838;
  border-color: #2a3142;
}
body.dark-mode .table-wrapper,
body.dark-mode .history-table-wrapper {
  background: #1a1e29;
  border-color: #2a3142;
}
body.dark-mode thead th {
  background: #262e42;
  color: #f0f2f5;
}
body.dark-mode th:first-child, 
body.dark-mode td:first-child {
  background: #1f2535;
  color: #f0f2f5;
}
body.dark-mode td {
  border-bottom: 1px solid #2a3142;
}
body.dark-mode .highlight-row { background: rgba(31, 122, 255, 0.25) !important; }
body.dark-mode .highlight-col { background: rgba(255, 79, 163, 0.2) !important; }
body.dark-mode .secondary-btn.gray {
  background: #262e42;
  color: #d1d5db;
}
body.dark-mode .modal {
  background: #1a1e29;
  color: #f0f2f5;
}
body.dark-mode input[type="range"] {
  background: #2a3142;
}
body.dark-mode input[type="range"]::-webkit-slider-thumb {
  background: #1a1e29;
}
body.dark-mode .filter-item select,
body.dark-mode .input-row input, 
body.dark-mode .input-row select {
  background: #222838;
  color: #f0f2f5;
  border-color: #2a3142;
}

</style>
</head>
</html>
